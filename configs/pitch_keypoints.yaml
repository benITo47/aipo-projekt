# Canonical pitch keypoint scheme — 32 landmarks in FIFA pitch metres (105 × 68).
# Origin at the bottom-left corner; +x to the right, +y up.
#
# Both the training labels and the live pipeline assume THIS ORDER. If you train
# on a dataset with a different keypoint scheme, edit this file to match.

pitch_size_m: [105.0, 68.0]
num_keypoints: 32

# flip_idx tells Ultralytics how to re-order keypoints under horizontal flip
# augmentation (mirror left↔right side of the pitch).
flip_idx: [1, 0, 3, 2,  4, 5,  12, 13, 10, 11, 8, 9, 6, 7,  20, 21, 18, 19, 16, 17, 14, 15,  24, 25, 22, 23,  26, 27,  28,  30, 29,  31]

# (label, x_m, y_m). Order is the keypoint index.
keypoints:
  # ---- outer pitch corners (0–3)
  - [TL,                     0.0,    68.0]
  - [TR,                   105.0,    68.0]
  - [BR,                   105.0,     0.0]
  - [BL,                     0.0,     0.0]

  # ---- halfway line endpoints (4–5)
  - [HALFWAY_TOP,           52.5,    68.0]
  - [HALFWAY_BOT,           52.5,     0.0]

  # ---- left penalty area corners (6–9)
  - [PEN_L_OUT_TOP,          0.0,    54.16]
  - [PEN_L_OUT_BOT,          0.0,    13.84]
  - [PEN_L_IN_TOP,          16.5,    54.16]
  - [PEN_L_IN_BOT,          16.5,    13.84]

  # ---- right penalty area corners (10–13)
  - [PEN_R_IN_TOP,          88.5,    54.16]
  - [PEN_R_IN_BOT,          88.5,    13.84]
  - [PEN_R_OUT_TOP,        105.0,    54.16]
  - [PEN_R_OUT_BOT,        105.0,    13.84]

  # ---- left goal area corners (14–17)
  - [GOAL_L_OUT_TOP,         0.0,    43.16]
  - [GOAL_L_OUT_BOT,         0.0,    24.84]
  - [GOAL_L_IN_TOP,          5.5,    43.16]
  - [GOAL_L_IN_BOT,          5.5,    24.84]

  # ---- right goal area corners (18–21)
  - [GOAL_R_IN_TOP,         99.5,    43.16]
  - [GOAL_R_IN_BOT,         99.5,    24.84]
  - [GOAL_R_OUT_TOP,       105.0,    43.16]
  - [GOAL_R_OUT_BOT,       105.0,    24.84]

  # ---- goalposts on goal-line (22–25)
  - [GOALPOST_L_TOP,         0.0,    37.66]
  - [GOALPOST_L_BOT,         0.0,    30.34]
  - [GOALPOST_R_TOP,       105.0,    37.66]
  - [GOALPOST_R_BOT,       105.0,    30.34]

  # ---- centre circle intersections with halfway line (26–27)
  - [CENTRE_CIRC_TOP,       52.5,    43.15]   # 34 + 9.15
  - [CENTRE_CIRC_BOT,       52.5,    24.85]   # 34 - 9.15

  # ---- centre spot (28)
  - [CENTRE_SPOT,           52.5,    34.0]

  # ---- penalty spots (29–30)
  - [PEN_SPOT_L,            11.0,    34.0]
  - [PEN_SPOT_R,            94.0,    34.0]

  # ---- penalty arc apex on the pitch axis (31): far edge of L penalty arc, 16.5 + 9.15 = 25.65 m
  - [PEN_ARC_APEX,         25.65,    34.0]
