# Detector training config — consumed by `python train.py detector`.
# Forwarded verbatim to `ultralytics.YOLO.train()`.
#
# v2 (back to small variant — quicker iteration loop):
#   - yolo26s — small variant, ~9 GB VRAM at batch 16 / imgsz 1280
#   - epochs 80 → 120 (patience 30 still triggers early-stop if it stalls)
#   - explicit AdamW + lr0 5e-4 to match the pitch model's collapse-proof recipe

model: yolo26s.pt          # small variant — keeps full-train under 90 min on RTX 3090
data: configs/combined.yaml

epochs: 120
imgsz: 1280                # high-res helps with small/distant players
batch: 16                  # 16 needs ~9 GB VRAM on yolo26s; safe on 16 GB
device: 0
workers: 8

optimizer: AdamW
lr0: 0.0005
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0

# Augmentation — broadcast / mixed-source data benefits from heavier jitter
mosaic: 1.0
mixup: 0.1
scale: 0.5
perspective: 0.0005        # mild — players are easier than pitch lines
degrees: 3.0
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

project: runs/detect
name: yolo26s_v2
patience: 30
save_period: 10
exist_ok: true             # let re-runs reuse the directory without crashing
plots: true
