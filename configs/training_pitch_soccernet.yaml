# Pitch keypoint model retrained from scratch on SoccerNet calibration-2023
# 13k train / 2.5k val — vs previous 255 images

model: yolo26n-pose.pt
data: configs/soccernet_pitch.yaml
task: pose

epochs: 100
imgsz: 960
batch: 32
device: 0
workers: 8

lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0

mosaic: 0.5
mixup: 0.0
scale: 0.4
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

project: runs/pose
name: yolo26n_pitch_soccernet
patience: 20
save_period: 10
exist_ok: false
plots: true
