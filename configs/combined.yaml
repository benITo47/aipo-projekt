# Combined player-detection dataset (SoccerNet + Roboflow → YOLO format).
# Generated by `python dataset.py merge`. Path is relative to repo root, so this
# works on any machine where the merge step has been run.
path: data/processed/combined
train: images/train
val: images/val
names:
  0: player
  1: goalkeeper
  2: referee
  3: ball
