# Pitch keypoint detector — YOLO26-pose, nano variant.
# Small model, single bbox class ("pitch"), 32 keypoints.

model: models/checkpoints/pitch.pt    # resume fine-tuning from last checkpoint
data: configs/pitch.yaml
task: pose

epochs: 200
imgsz: 1280
batch: 16
device: 0
workers: 8

lr0: 0.0002          # niższy LR przy dotrenowywaniu
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0.0   # brak warmup — kontynuujemy trening

# Augmentation — pitch lines are sensitive to perspective jitter; keep mild
mosaic: 0.5
mixup: 0.0
scale: 0.3
fliplr: 0.5      # uses flip_idx from configs/pitch.yaml to mirror keypoint order
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

project: runs/pose
name: yolo26n_pitch
patience: 30
save_period: 10
exist_ok: true
plots: true
