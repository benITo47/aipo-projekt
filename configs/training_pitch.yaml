# Pitch keypoint detector — YOLO26-pose, medium variant.
# Single bbox class ("pitch") + 32 keypoints.
#
# v3 (post-diagnostic on broadcast clip):
#   - small → medium (32 keypoints need real model capacity)
#   - epochs 60 → 100 (patience 20 still triggers early-stop)
#   - crop_fraction stays: this is what teaches the model to handle one-sided
#     pitch views (right-half or left-half only) as a primary case rather than
#     a degraded edge case
#   - exist_ok: true so re-runs don't fail

model: yolo26m-pose.pt
data: configs/pitch.yaml
task: pose

epochs: 100
imgsz: 960
batch: 2                   # yolo26m-pose at 960 OOMs at batch=4 on 16 GB; batch=2 is safe
device: 0
workers: 4

# lr0=0.001 — NOT 5e-5. The fine-tune-collapse fix used 5e-5 when starting from an
# already-trained pitch checkpoint. Here we start from COCO human-pose weights whose
# keypoint head was re-initialised for 32 pitch keypoints; the head is random and
# needs a real learning rate. Box head converges fine at 1e-3 because it has strong
# pretrained priors; without 1e-3 the keypoint head barely moves (confirmed: after
# 44 epochs at 5e-5, pose_loss 10.6→8.7, kobj_loss completely stagnant).
optimizer: AdamW
lr0: 0.001
lrf: 0.05
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5.0

# Explicit pose/kobj loss weights (YOLO defaults, listed here so they are easy to tune).
pose: 12.0    # gain on pose OKS loss
kobj: 2.0     # higher than default (1.0) — encourages keypoint confidence to develop

# Augmentation — addressing the "half-pitch view" failure mode.
# Diagnostic on a broadcast clip showed the model only ever sees keypoints from
# one half of the pitch (the action side). Center-crop augmentation forces the
# model to learn confident predictions on partial views.
mosaic: 0.5
mixup: 0.0
scale: 0.75        # broadcast telephoto sim
perspective: 0.001 # lower camera angle sim
degrees: 5.0       # canted broadcast shots
crop_fraction: 0.7 # train on random partial views (key for one-sided pitch frames)
fliplr: 0.5        # uses flip_idx from configs/pitch.yaml to mirror keypoint order
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

project: runs/pose
name: yolo26m_pitch_v3
patience: 20
save_period: 10
exist_ok: true             # let re-runs reuse the directory without crashing
plots: true
