# Pitch keypoint detector — YOLO26-pose, medium variant.
# Single bbox class ("pitch") + 32 keypoints.
#
# v4 (top-notch keypoint push):
#   v3 baseline (yolo26m-pose, crop_fraction, perspective+degrees) plus:
#   - close_mosaic 15 — turn mosaic OFF in the last 15 epochs so the model
#     trains on whole, undisturbed pitches at the end (boosts keypoint
#     localisation accuracy)
#   - erasing: 0.4 — random cutout / patch-occlusion (simulates players +
#     graphics overlays blocking pitch landmarks)
#   - auto_augment: randaugment — colour-space domain randomisation
#   - cos_lr: true — cosine LR schedule instead of linear (smoother
#     convergence, less risk of overshoot on long runs)

model: yolo26m-pose.pt
# IMPORTANT: point at the COMBINED + green-suppressed dataset (~13k SoccerNet
# calibration-2023 broadcast frames + 317 Roboflow tactical-cam frames, all
# preprocessed with enhance_pitch_lines). Generated by:
#   python dataset.py preprocess-pitch
# DO NOT point this at configs/pitch.yaml — that's only the 317 Roboflow frames
# and trains a strictly worse model.
data: data/processed/combined_pitch_gs/data.yaml
task: pose

epochs: 120                # 100 → 120 — more capacity for the heavier aug
imgsz: 960
batch: 16                  # 16 needs ~16 GB VRAM at 960; drop to 8 if smaller
device: 0
workers: 8

# Optimizer — explicit AdamW (mirrors training_pitch_combined.yaml).
optimizer: AdamW
lr0: 0.00005
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: true               # cosine LR schedule

# Augmentation — pitch-line-aware, broadcast-style domain transfer.
# A wrong augmentation here is the difference between a 0.7 mAP and a 0.9 mAP model.
mosaic: 0.5                # 4-image mosaic — keypoint scheme can still match each tile
close_mosaic: 15           # disable mosaic in last 15 epochs (clean refinement)
mixup: 0.0                 # off — mixup blends keypoint labels and breaks geometry
scale: 0.75                # broadcast telephoto sim
perspective: 0.001         # lower camera angle sim
degrees: 5.0               # canted broadcast shots
crop_fraction: 0.7         # train on random partial views (one-sided pitch frames)
fliplr: 0.5                # uses flip_idx from configs/pitch.yaml
erasing: 0.4               # random cutout (players + graphics occluding landmarks)
auto_augment: randaugment  # colour-space jitter via standard policy
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

project: runs/pose
name: yolo26m_pitch_v4
patience: 25
save_period: 10
exist_ok: true             # let re-runs reuse the directory without crashing
plots: true
