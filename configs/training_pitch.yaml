# Pitch keypoint detector — YOLO26-pose, nano variant.
# Small model, single bbox class ("pitch"), 32 keypoints.

model: yolo26n-pose.pt    # n is plenty; pitch landmarks are big and structured
data: configs/pitch.yaml
task: pose

epochs: 60
imgsz: 1280
batch: 16
device: 0
workers: 8

lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0

# Augmentation — pitch lines are sensitive to perspective jitter; keep mild
mosaic: 0.5
mixup: 0.0
scale: 0.3
fliplr: 0.5      # uses flip_idx from configs/pitch.yaml to mirror keypoint order
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

project: runs/pose
name: yolo26n_pitch
patience: 15
save_period: 10
exist_ok: false
plots: true
