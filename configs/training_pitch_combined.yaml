# Pitch keypoint model: fine-tune from SoccerNet checkpoint on combined dataset
# Adds Roboflow tactical-camera frames to SoccerNet broadcast frames
#
# Training collapse post-mortem: auto optimizer chose MuSGD lr=0.01 which
# was too aggressive for fine-tuning → cls_loss exploded at epoch 9.
# Fix: explicit AdamW + lr0=0.00005 (100x lower than collapsed run).

model: models/checkpoints/pitch.pt
data: data/processed/combined_pitch_gs/data.yaml
task: pose

epochs: 60
imgsz: 960
batch: 16
device: 0
workers: 4

optimizer: AdamW
lr0: 0.00005
lrf: 0.01
momentum: 0.9
weight_decay: 0.0005
warmup_epochs: 3.0

mosaic: 0.5
mixup: 0.0
scale: 0.4
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

project: runs/pose
name: yolo26n_pitch_combined_v2
patience: 20
save_period: 10
exist_ok: false
plots: true
