# Pitch keypoint model: fine-tune from SoccerNet checkpoint on combined dataset
# Adds Roboflow tactical-camera frames to SoccerNet broadcast frames

model: models/checkpoints/pitch.pt
data: configs/combined_pitch.yaml
task: pose

epochs: 50
imgsz: 960
batch: 32
device: 0
workers: 8

lr0: 0.0005
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2.0

mosaic: 0.5
mixup: 0.0
scale: 0.4
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

project: runs/pose
name: yolo26n_pitch_combined
patience: 15
save_period: 10
exist_ok: false
plots: true
