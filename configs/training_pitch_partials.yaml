# Train from scratch on the augmented combined dataset
# (originals + photometric copies + 11 strategic partial-pitch crops).
# Consumed by `python train_pitch_partials.py`.
#
# Same recipe as training_pitch.yaml but:
#   - points at data/processed/combined_pitch_gs_aug/data.yaml
#   - fewer epochs (60 vs 120) — dataset is ~8× larger, converges faster
#   - lighter on-the-fly photometric augmentation — the dataset already
#     carries that variance; doubling up would over-noise the signal

model: yolo26s-pose.pt
data: data/processed/combined_pitch_gs_aug/data.yaml
task: pose

epochs: 60
imgsz: 960
batch: 16
device: 0
workers: 8

optimizer: AdamW
lr0: 0.001            # keypoint head re-inits to 32 kpts → trains from scratch
lrf: 0.05
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: true

pose: 12.0
kobj: 2.0

# Augmentation — lighter than training_pitch.yaml because the augmented
# dataset already provides HSV / blur / dropout / partial-pitch variance
# at the source.
mosaic: 0.5
close_mosaic: 10
mixup: 0.0
scale: 0.6                 # was 0.75 — partials already represent zoomed views
perspective: 0.0005
degrees: 3.0
crop_fraction: 0.85        # was 0.7 — partials already cropped at the source
fliplr: 0.5
erasing: 0.3
auto_augment: randaugment
hsv_h: 0.01
hsv_s: 0.3
hsv_v: 0.2

project: runs/pose
name: yolo26s_pitch_partials
patience: 15
save_period: 10
exist_ok: true
plots: true
